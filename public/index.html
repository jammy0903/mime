<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>밈 레이더 - YouTube 밈 트렌드</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 헤더 -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <span class="logo">📡</span>
        <h1>밈 레이더</h1>
        <span class="header-badge" id="trend-count"></span>
      </div>
      <div class="header-right">
        <span class="last-update" id="last-update"></span>
        <button id="btn-refresh" class="icon-btn" title="새로고침">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="설정">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 데이터 현황 -->
  <div class="stats-bar" id="stats-bar"></div>

  <!-- 메인 콘텐츠 -->
  <main class="main">
    <div id="feed" class="feed">
      <div class="loading">
        <div class="spinner"></div>
        <p>YouTube 댓글 수집 중...</p>
      </div>
    </div>
  </main>

  <!-- 설정 모달 -->
  <div id="settings-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>설정</h2>
        <button id="btn-close-settings" class="icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <!-- YouTube 설정 -->
        <section class="section">
          <h3>YouTube 크롤링</h3>
          <div class="field">
            <label>YouTube Data API 키 (선택)</label>
            <input type="password" id="youtube-api-key" placeholder="없으면 InnerTube 모드로 자동 동작">
            <p class="hint">API 키가 없어도 작동합니다. 할당량 초과 시에도 자동으로 폴백됩니다.</p>
          </div>
          <div class="field">
            <label>수집 영상 수</label>
            <select id="max-videos">
              <option value="10">10개</option>
              <option value="20" selected>20개</option>
              <option value="30">30개</option>
              <option value="50">50개</option>
            </select>
          </div>
        </section>

        <!-- AI 설정 -->
        <section class="section">
          <h3>AI 밈 설명</h3>
          <div class="field">
            <label>AI 제공자</label>
            <select id="ai-provider">
              <option value="claude">Claude (Anthropic)</option>
              <option value="openai">GPT (OpenAI)</option>
            </select>
          </div>
          <div class="field">
            <label>API 키</label>
            <input type="password" id="api-key" placeholder="API 키를 입력하세요">
            <p class="hint">키는 서버 메모리에만 저장됩니다.</p>
          </div>
        </section>

        <!-- 크롤링 주기 -->
        <section class="section">
          <h3>크롤링 주기</h3>
          <div class="field">
            <select id="crawl-interval">
              <option value="15">15분</option>
              <option value="30" selected>30분</option>
              <option value="60">1시간</option>
              <option value="120">2시간</option>
            </select>
          </div>
        </section>

        <!-- 데이터 관리 -->
        <section class="section">
          <h3>데이터 관리</h3>
          <div class="btn-row">
            <button id="btn-clear" class="btn-danger">수집 데이터 초기화</button>
            <button id="btn-clear-cache" class="btn-secondary">AI 캐시 초기화</button>
          </div>
        </section>
      </div>
      <div class="modal-footer">
        <span id="save-status"></span>
        <button id="btn-save" class="btn-primary">저장</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
